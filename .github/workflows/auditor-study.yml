# auditor-study — exclusão (B) dos PRs do estudo de usuário (Fase 1, 1c; docs/user-study.md do auditor).
# Disparo manual; só leitura. Para cada PR elegível (study/selection.json do auditor, na ref fixada),
# aplica o patch sobre o Mathlib e1b2403b SÓ no runner, audita os arquivos alterados e desfaz.
name: auditor-study

on:
  workflow_dispatch:
    inputs:
      auditor-ref:
        description: "commit (SHA) fixado do auditor"
        required: true
        type: string

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-24.04   # fixado (D-55)
    timeout-minutes: 120
    steps:
      - name: checkout do Mathlib no commit fixado (e1b2403b)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: leanprover-community/mathlib4
          ref: e1b2403bdd31a2756e30282d62b3fa54cc95c869
          persist-credentials: false

      - name: configuração do auditor para o Mathlib (.auditor/ deste repositório)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: .measurements
          persist-credentials: false

      - name: sobrepor .auditor/ e conferir o commit do Mathlib
        run: |
          cp -r .measurements/.auditor .
          rm -rf .measurements
          test "$(git rev-parse HEAD)" = e1b2403bdd31a2756e30282d62b3fa54cc95c869

      - name: checkout do auditor (ref fixada)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Enzo47961/auditor
          ref: ${{ inputs.auditor-ref }}
          path: .auditor-tool
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: instalar o auditor (e tirá-lo do workspace, D-62)
        run: |
          python -m pip install ./.auditor-tool
          mv .auditor-tool "$RUNNER_TEMP/auditor-tool"

      - name: instalar elan (release fixada, SHA-256 conferido)
        env:
          ELAN_VERSION: v4.2.4
          ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
        run: |
          curl -sSfL "https://github.com/leanprover/elan/releases/download/$ELAN_VERSION/elan-x86_64-unknown-linux-gnu.tar.gz" -o "$RUNNER_TEMP/elan.tar.gz"
          echo "$ELAN_SHA256  $RUNNER_TEMP/elan.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: conferências de base
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          { echo "commit: $(git rev-parse HEAD)"; echo "toolchain: $(cat lean-toolchain)";
            echo "auditor: $(git -C "$RUNNER_TEMP/auditor-tool" rev-parse HEAD)";
            echo "study"; } | tee "$RUNNER_TEMP/out/base.txt"
          git merge-base --is-ancestor e1b2403bdd31a2756e30282d62b3fa54cc95c869 HEAD
          git diff --quiet e1b2403bdd31a2756e30282d62b3fa54cc95c869 HEAD -- '*.lean'
          echo "nenhum .lean difere de e1b2403b" | tee -a "$RUNNER_TEMP/out/base.txt"

      - name: lake exe cache get
        run: lake exe cache get 2>&1 | tail -20

      - name: estudo — auditar os PRs elegíveis e aplicar a exclusão (B)
        run: |
          T="$RUNNER_TEMP/auditor-tool"
          python "$T/tools/phase1/study_audit.py" . --selection "$T/study/selection.json" --patches "$T/study/patches" --policy "$T/policy.toml" --out "$RUNNER_TEMP/out"
          git status --short | head -5

      - name: artefato
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: auditor-study
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
