# auditor-mutation — testes de mutação do auditor (docs/maintenance.md, "Testes de mutação") num
# runner do GitHub em vez da máquina do mantenedor. Só no repositório de medições (auditor-measurements); disparo manual; só leitura.
# Roda tools/mutation/run.py nos grupos pedidos, sobre o commit fixado do auditor, e entrega o log
# como artefato `auditor-mutation`. Não commita, não comenta, não abre PR.
name: auditor-mutation

on:
  workflow_dispatch:
    inputs:
      auditor-ref:
        description: "commit (SHA) fixado do auditor"
        required: true
        type: string
      groups:
        description: "grupos do catálogo, separados por espaço"
        default: "allowlist gen_tcb_roots"
        type: string

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-24.04   # fixado (D-55)
    timeout-minutes: 180
    steps:
      - name: checkout do auditor (ref fixada)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Enzo47961/auditor
          ref: ${{ inputs.auditor-ref }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: instalar o auditor com dependências de teste
        run: python -m pip install -e ".[test]"

      - name: instalar elan (release fixada, SHA-256 conferido)
        env:
          ELAN_VERSION: v4.2.4
          ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
        run: |
          curl -sSfL "https://github.com/leanprover/elan/releases/download/$ELAN_VERSION/elan-x86_64-unknown-linux-gnu.tar.gz" -o "$RUNNER_TEMP/elan.tar.gz"
          echo "$ELAN_SHA256  $RUNNER_TEMP/elan.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: mutação
        env:
          GROUPS: ${{ inputs.groups }}
        run: |
          mkdir -p "$RUNNER_TEMP/mut"
          { echo "auditor: $(git rev-parse HEAD)"; echo "grupos: $GROUPS"; } | tee "$RUNNER_TEMP/mut/mutation.log"
          set +e
          # shellcheck disable=SC2086
          python tools/mutation/run.py $GROUPS 2>&1 | tee -a "$RUNNER_TEMP/mut/mutation.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit=$rc" | tee -a "$RUNNER_TEMP/mut/mutation.log"
          exit "$rc"

      - name: artefato
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: auditor-mutation
          path: ${{ runner.temp }}/mut
          if-no-files-found: warn
